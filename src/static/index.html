<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI 人脸识别</title>
</head>
<body>
    <h2>实时人脸识别</h2>
    <img src="/video_feed" width="640" height="480">

    <h3>注册人脸</h3>
    <input type="text" id="name" placeholder="输入姓名">
    <input type="file" id="imageUpload">
    <button onclick="registerFace()">注册</button>

    <h3>已注册人脸</h3>
    <button onclick="listFaces()">获取列表</button>
    <ul id="faceList"></ul>

    <script>
        function registerFace() {
            const name = document.getElementById('name').value;
            const fileInput = document.getElementById('imageUpload').files[0];

            if (!name || !fileInput) {
                alert("请输入姓名并上传照片！");
                return;
            }

            const formData = new FormData();
            formData.append("name", name);
            formData.append("file", fileInput);

            fetch('/register_face', {
                method: 'POST',
                body: formData
            }).then(response => response.json())
            .then(data => alert(data.message || data.error));
        }

        function listFaces() {
            fetch('/list_faces')
                .then(response => response.json())
                .then(data => {
                    const faceList = document.getElementById('faceList');
                    faceList.innerHTML = "";
                    data.registered_faces.forEach(face => {
                        const li = document.createElement("li");
                        li.textContent = face;
                        faceList.appendChild(li);
                    });
                });
        }
    </script>
</body>
</html>
